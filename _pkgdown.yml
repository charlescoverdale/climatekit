url: https://charlescoverdale.github.io/climatekit/

template:
  bootstrap: 5

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [search, github]

reference:
  - title: "Temperature"
    desc: "Daily temperature indices"
    contents:
      - ck_frost_days
      - ck_ice_days
      - ck_summer_days
      - ck_tropical_nights
      - ck_txx
      - ck_tnx
      - ck_txn
      - ck_tnn
      - ck_tx10p
      - ck_tn10p
      - ck_tx90p
      - ck_tn90p
      - ck_wsdi
      - ck_csdi
      - ck_warm_spell
      - ck_hwn
      - ck_hwf
      - ck_hwd
      - ck_hwm
      - ck_hwa
      - ck_cwn
      - ck_cwf
      - ck_cwd
      - ck_cwm
      - ck_cwa
      - ck_ehf
      - ck_diurnal_range
      - ck_first_frost
      - ck_last_frost
      - ck_convert_temp

  - title: "Precipitation"
    desc: "Rainfall and drought indices"
    contents:
      - ck_total_precip
      - ck_dry_days
      - ck_wet_days
      - ck_heavy_precip
      - ck_very_heavy_precip
      - ck_max_1day_precip
      - ck_max_5day_precip
      - ck_precip_intensity
      - ck_r95p
      - ck_r99p
      - ck_spi
      - ck_spei
      - ck_pet
      - ck_pet_pm

  - title: "Agroclimatic"
    desc: "Growing-season and viticulture indices"
    contents:
      - ck_growing_degree_days
      - ck_growing_season
      - ck_cooling_degree_days
      - ck_heating_degree_days
      - ck_huglin
      - ck_winkler
      - ck_branas
      - ck_pet

  - title: "Comfort and Hazard"
    desc: "Heat, fire, and wind indices"
    contents:
      - ck_heat_index
      - ck_humidex
      - ck_wind_chill
      - ck_fire_danger

  - title: "Gridded / netCDF"
    desc: "Apply any climatekit index over a SpatRaster or read netCDF input"
    contents:
      - ck_apply_grid
      - ck_from_netcdf

  - title: "General"
    desc: "Compute any index by name; metadata; ETCCDI 27 audit; catalogue"
    contents:
      - ck_compute
      - ck_available
      - ck_metadata
      - ck_etccdi_27
      - ck_catalogue
      - ck_browse
      - clear_cache


  - title: "Package"
    contents:
      - climatekit-package
